<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Stat Asker</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="home">

<header class="top">
  <a class="brand" href="/" aria-label="Stat Asker home">
    <svg class="seam" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>
      <path d="M7.6 6.2c3.2 3 4.8 6.4 4.8 9.8s-1.6 6.8-4.8 9.8M24.4 6.2c-3.2 3-4.8 6.4-4.8 9.8s1.6 6.8 4.8 9.8"
            fill="none" stroke="var(--brand)" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">Stat Asker</span>
  </a>

  <form class="search" id="form" role="search" autocomplete="off">
    <div class="field">
      <svg class="icon lead" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" name="q" type="search" enterkeyhint="search" spellcheck="false" autocapitalize="off"
             placeholder="Ask anything about baseball"
             aria-label="Ask a baseball question" aria-controls="sugg" aria-autocomplete="list" aria-expanded="false">
      <button type="button" class="clear" id="clear" aria-label="Clear search" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      </button>
      <button type="submit" class="go" aria-label="Search">Ask</button>
    </div>
    <ul class="sugg" id="sugg" role="listbox" hidden></ul>
  </form>
</header>

<main id="main" aria-live="polite">
  <section class="landing" id="landing">
    <p class="tagline">Stats, standings, scores and baseball history — through yesterday.</p>
    <div class="groups" id="groups"></div>
  </section>
  <section class="results" id="results" hidden></section>
</main>

<footer class="foot" id="foot"><span id="status">Loading…</span></footer>

<script src="/static/app.js"></script>
</body>
</html>
