<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB Stat Asker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23fff' stroke='%23c8102e' stroke-width='6'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14181f;--muted:#5b6573;--line:#e2e6ec;--accent:#0c2c56;--accent-ink:#fff;--user:#0c2c56;--user-ink:#fff;--quote:#eef2f8;--chip:#eaeff7}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--panel:#171b22;--ink:#e8ecf2;--muted:#97a1b0;--line:#272d37;--accent:#6aa0ff;--accent-ink:#0b0e13;--user:#24467f;--user-ink:#fff;--quote:#1d2430;--chip:#202734}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0}
header .meta{color:var(--muted);font-size:.85rem}
main{flex:1;overflow-y:auto;padding:16px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.msg{max-width:100%;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);color:var(--user-ink);border-color:transparent;max-width:85%}
.msg p{margin:.2em 0}
.msg blockquote{margin:.5em 0;padding:.4em .8em;border-left:3px solid var(--accent);background:var(--quote);border-radius:4px}
.msg .foot{margin-top:.5em;color:var(--muted);font-size:.8rem}
.tablewrap{overflow-x:auto;margin-top:.5em}.tablewrap table{min-width:min(100%,560px)}
table{border-collapse:collapse;font-size:.88rem;min-width:100%}
th,td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--accent);outline:none}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel)}
form .row{max-width:860px;margin:0 auto;display:flex;gap:8px;width:100%}
input{flex:1;font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button.send{font:inherit;padding:10px 18px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:600}
button.send:disabled{opacity:.5;cursor:default}
.typing{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<header>
  <h1>⚾ MLB Stat Asker</h1>
  <span class="meta" id="meta">loading…</span>
</header>
<main id="log"><div class="wrap" id="wrap"></div></main>
<form id="f"><div class="row">
  <input id="q" autocomplete="off" placeholder="Ask anything: stats, standings, scores, or baseball history…" aria-label="Question">
  <button class="send" id="go">Ask</button>
</div></form>
<script>
const wrap = document.getElementById('wrap'), log = document.getElementById('log');
const q = document.getElementById('q'), go = document.getElementById('go');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(t){
  const lines = esc(t).split('\n'); let out = '', inList = false;
  for (let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>');
    if (/^&gt; /.test(l)) { if(inList){out+='</ul>';inList=false} out += '<blockquote>'+l.slice(5)+'</blockquote>'; }
    else if (/^- /.test(l)) { if(!inList){out+='<ul>';inList=true} out += '<li>'+l.slice(2)+'</li>'; }
    else { if(inList){out+='</ul>';inList=false} if(l.trim()) out += '<p>'+l+'</p>'; }
  }
  return out + (inList?'</ul>':'');
}
function add(cls, html){ const d = document.createElement('div'); d.className = 'msg '+cls; d.innerHTML = html; wrap.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
function render(a){
  let h = md(a.text);
  if (a.rows && a.rows.length){
    h += '<div class="tablewrap"><table><thead><tr>'+a.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'
      + a.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  }
  if (a.footnote) h += '<div class="foot">'+esc(a.footnote)+'</div>';
  return h;
}
async function ask(text){
  if (!text.trim()) return;
  add('user', esc(text)); q.value = ''; go.disabled = true;
  const t = add('', '<span class="typing">Looking that up…</span>');
  try {
    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question:text})});
    t.innerHTML = render(await r.json());
  } catch(e){ t.innerHTML = 'Couldn’t reach the server.'; }
  go.disabled = false; q.focus(); log.scrollTop = log.scrollHeight;
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); ask(q.value); });
const examples = ['Who leads MLB in home runs?','Show me the standings','What was the score of the Brewers game last night?','Last time a game ended on a pickoff at first base','List all unassisted triple plays','How many walk-off home runs in 2009?'];
const intro = add('', '<p>Ask about stats, standings, scores, or odd moments in baseball history. I only use games through <strong>yesterday</strong>.</p><div class="chips" id="chips"></div>');
examples.forEach(x => { const b = document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=x; b.onclick=()=>ask(x); intro.querySelector('#chips').appendChild(b); });
fetch('/api/status').then(r=>r.json()).then(s=>{
  const i = s.index || {}; const hist = i.games ? `${i.games.toLocaleString()} games indexed (${i.first_season}–${i.last_season})` : 'history index not built yet';
  document.getElementById('meta').textContent = `Data through ${s.cutoff} · ${hist}` + (s.syncing ? ' · syncing…' : '');
}).catch(()=>{ document.getElementById('meta').textContent = 'offline'; });
q.focus();
</script>
</body>
</html>
